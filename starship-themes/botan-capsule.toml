# Generated: hololive=botan (Shishiro Botan) — all-dark bar, white text stripes, gold ornament, sharp chevrons
# Structure mirrors noel.toml. Gold (#d4a94a) appears ONCE, on the git branch, like an earring.
# Strictly neutral greys elsewhere: no warm tint, to stay clear of watame/fluttershy's gold chassis.
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](#2b2f36)\
[ 🦁 ](bg:#2b2f36 fg:#d4a94a)\
$username$hostname\
[](fg:#2b2f36 bg:#0e0f12)[](fg:#0e0f12 bg:#f2f3f5)[](fg:#f2f3f5 bg:#0e0f12)[](fg:#0e0f12 bg:#f2f3f5)[](fg:#f2f3f5 bg:#0e0f12)[](fg:#0e0f12 bg:#f2f3f5)[](fg:#f2f3f5 bg:#0e0f12)[](fg:#0e0f12 bg:#1b1e24)\
$directory\
[](fg:#1b1e24 bg:#8b9098)[](fg:#8b9098 bg:#5a5f68)[](fg:#5a5f68 bg:#3f434a)[](fg:#3f434a bg:#d4a94a)[](fg:#d4a94a bg:#2b2f36)\
$git_branch$git_status\
[](fg:#2b2f36 bg:#1b1e24)\
$nodejs$rust$golang$php$python\
[](fg:#1b1e24 bg:#0e0f12)\
$time\
[](fg:#0e0f12)\
\n$character"""

[directory]
style = "fg:#f2f3f5 bg:#1b1e24"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = "󰇚 "

[git_branch]
symbol = ""
format = '[ $symbol $branch ](fg:#d4a94a bg:#2b2f36)'

[git_status]
format = '[($all_status$ahead_behind )](fg:#c8cbd0 bg:#2b2f36)'

[nodejs]
symbol = ""
format = '[ $symbol ($version) ](fg:#8b9098 bg:#1b1e24)'

[rust]
symbol = ""
format = '[ $symbol ($version) ](fg:#8b9098 bg:#1b1e24)'

[golang]
symbol = ""
format = '[ $symbol ($version) ](fg:#8b9098 bg:#1b1e24)'

[php]
symbol = ""
format = '[ $symbol ($version) ](fg:#8b9098 bg:#1b1e24)'

[python]
symbol = ""
format = '[ $symbol ($version )(\($virtualenv\) )](fg:#8b9098 bg:#1b1e24)'
python_binary = ["python", "python3"]

[time]
disabled = false
time_format = "%R"
format = '[  $time ](fg:#71757d bg:#0e0f12)'

[username]
show_always = true
format = '[ $user](bg:#2b2f36 fg:#f2f3f5)'

[hostname]
ssh_only = false
ssh_symbol = "󰣀"
format = '[@$hostname ](bg:#2b2f36 fg:#f2f3f5)'

[character]
success_symbol = '[❯](bold #d4a94a)'
error_symbol = '[❯](bold #e05555)'
